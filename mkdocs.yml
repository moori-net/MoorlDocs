site_name: Shopware 6 Plugin Dokumentation
copyright: >
  <a href="#__consent">Change cookie settings</a>
theme:
  name: 'material'
  custom_dir: docs-source/overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      accent: light green
      primary: deep orange
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
markdown_extensions:
  - meta
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
plugins:
  - tags:
  - i18n:
      reconfigure_material: true
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Fehlermeldungen: Error messages
            Plugin Dokumentation: Plugin Documentation
            Übersicht: Overview
            Impressum: Imprint
  - search
hooks:
  - hooks/plugin_nav.py
docs_dir: 'docs-source'
not_in_nav: |
  /plugin/**/store.md
  /plugin/**/store.??.md
  /plugin/**/store.tpl.md
  /plugin/**/store.??.tpl.md
  /plugin/**/manual.md
  /plugin/**/manual.??.md
  /plugin/**/manual.tpl.md
  /plugin/**/manual.??.tpl.md
site_dir: 'docs-html'
site_url: 'https://docs.moori.net'
extra:
  alternate:
    - name: Deutsch
      link: ./
      lang: de
      default: true
    - name: English
      link: ./en/
      lang: en
  consent:
    title: Cookie consent
    description: >
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    cookies:
      matomo: Matomo Analytics
    actions:
      - manage
      - accept
      - reject
extra_css:
  - jquery.fancybox.min.css
  - extra.css
extra_javascript:
  - jquery-3.5.0.slim.min.js
  - jquery.fancybox.min.js
  - extra.js
nav:
  - Home: index.md
  - Fehlermeldungen:
      - 'error-messages/index.md'
  - Plugin Dokumentation:
      # hooks/plugin_nav.py adds the plugin entries after this overview.
      - 'plugin/index.md'
  - Shopware Store: 'https://store.shopware.com/de/extension-partners/moori-media'
  - Demo Shop: 'https://demo-sw67.moori.net/'
  - Impressum: 'https://moori.media/de/impressum'
